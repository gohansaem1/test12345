<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로또 번호 생성기</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6efe4;
      --panel: rgba(255, 252, 246, 0.88);
      --line: rgba(94, 62, 35, 0.14);
      --text: #2b2118;
      --accent: #b85c38;
      --accent-strong: #8f3f24;
      --shadow: 0 24px 60px rgba(92, 55, 25, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.8), transparent 28%),
        radial-gradient(circle at bottom right, rgba(184, 92, 56, 0.18), transparent 30%),
        linear-gradient(135deg, #f9f2e8, #f1dfc9 50%, #eed6ba);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(760px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .hero {
      padding: 40px 32px 24px;
      background:
        linear-gradient(120deg, rgba(184, 92, 56, 0.14), rgba(255, 255, 255, 0)),
        linear-gradient(180deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0));
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 3.2rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .lead {
      margin: 0;
      color: rgba(43, 33, 24, 0.78);
      font-size: 1rem;
    }

    .content {
      padding: 8px 32px 32px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0 28px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 20px;
      font: inherit;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 14px 28px rgba(184, 92, 56, 0.28);
    }

    .secondary {
      background: rgba(255, 255, 255, 0.72);
      color: var(--text);
      border: 1px solid var(--line);
    }

    button:hover {
      transform: translateY(-1px);
    }

    .sets {
      display: grid;
      gap: 16px;
    }

    .set {
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px;
      background: rgba(255, 255, 255, 0.64);
    }

    .set-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      font-size: 0.95rem;
      color: rgba(43, 33, 24, 0.72);
    }

    .balls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .ball {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 700;
      color: #fff;
      box-shadow: inset 0 -6px 12px rgba(0, 0, 0, 0.14);
    }

    .range-1 { background: #f0a202; }
    .range-2 { background: #2f80ed; }
    .range-3 { background: #e76f51; }
    .range-4 { background: #7c5cff; }
    .range-5 { background: #2a9d8f; }

    .summary {
      margin-top: 24px;
      padding: 18px;
      border-radius: 20px;
      background: rgba(43, 33, 24, 0.06);
      font-size: 0.95rem;
      color: rgba(43, 33, 24, 0.78);
    }

    @media (max-width: 640px) {
      .hero,
      .content {
        padding-left: 20px;
        padding-right: 20px;
      }

      .ball {
        width: 48px;
        height: 48px;
      }

      .set-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <h1>로또 번호 생성기</h1>
      <p class="lead">1부터 45까지 중복 없는 번호 6개를 자동으로 뽑습니다. 한 번에 5게임까지 생성할 수 있습니다.</p>
    </section>
    <section class="content">
      <div class="controls">
        <button class="primary" id="generateBtn" type="button">번호 생성</button>
        <button class="secondary" id="regenerateBtn" type="button">다시 뽑기</button>
      </div>
      <div class="sets" id="sets"></div>
      <div class="summary" id="summary"></div>
    </section>
  </main>

  <script>
    const setsElement = document.getElementById("sets");
    const summaryElement = document.getElementById("summary");
    const generateBtn = document.getElementById("generateBtn");
    const regenerateBtn = document.getElementById("regenerateBtn");

    function pickNumbers() {
      const pool = Array.from({ length: 45 }, (_, index) => index + 1);
      const numbers = [];

      while (numbers.length < 6) {
        const randomIndex = Math.floor(Math.random() * pool.length);
        numbers.push(pool.splice(randomIndex, 1)[0]);
      }

      return numbers.sort((a, b) => a - b);
    }

    function getRangeClass(number) {
      if (number <= 10) return "range-1";
      if (number <= 20) return "range-2";
      if (number <= 30) return "range-3";
      if (number <= 40) return "range-4";
      return "range-5";
    }

    function renderSets() {
      const sets = Array.from({ length: 5 }, () => pickNumbers());
      const timestamp = new Date().toLocaleString("ko-KR");

      setsElement.innerHTML = sets.map((numbers, index) => `
        <article class="set">
          <div class="set-header">
            <strong>${index + 1}게임</strong>
            <span>${numbers.join(" · ")}</span>
          </div>
          <div class="balls">
            ${numbers.map((number) => `
              <div class="ball ${getRangeClass(number)}">${number}</div>
            `).join("")}
          </div>
        </article>
      `).join("");

      summaryElement.textContent = `${timestamp} 기준으로 새 번호 5세트를 생성했습니다. 번호는 무작위이며 당첨을 보장하지 않습니다.`;
    }

    generateBtn.addEventListener("click", renderSets);
    regenerateBtn.addEventListener("click", renderSets);

    renderSets();
  </script>
</body>
</html>
